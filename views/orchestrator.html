<div style="display:flex;gap:15px;padding:15px;height:calc(100vh - 80px);background:#05050a">
  
  <!-- 1. LEFT PANEL: CAMPAIGN SETUP (Fixed Width) -->
  <div style="width:300px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex-shrink:0">
    <div class="S" style="padding:12px;margin-bottom:0">
      <div class="ST">&#x1F501; Orchestrator <span class="new">v8.3</span></div>
      
      <label style="font-size:.6rem;margin-top:10px">Target Application</label>
      <div style="display:flex;gap:5px;align-items:center;margin-bottom:8px">
        <select id="orc_target_select" onchange="orcUpdateTargetInfo()" style="flex:1;font-size:.65rem;padding:4px"></select>
        <button class="btn bS" style="padding:4px 6px;font-size:.55rem" onclick="orcQuickEditTarget()">📝</button>
        <button class="btn bS" style="padding:4px 6px;font-size:.55rem" onclick="tmOpenAddModal()">➕</button>
      </div>

      <label style="font-size:.6rem">Campaign Type</label>
      <select id="orc_campaign_type" onchange="orcToggleAgentDepth(this.value)" style="font-size:.65rem;padding:4px;margin-bottom:8px;width:100%">
        <option value="jailbreak">Jailbreak Library</option>
        <option value="owasp">OWASP LLM Top 10</option>
        <option value="agentic">Agentic Hijack</option>
        <option value="custom">Custom / Staged</option>
        <option value="auto_agent" style="color:#ff0090;font-weight:bold">⚡ Full Autonomous Agent</option>
      </select>

      <div id="orc_agent_config" style="display:none;margin-bottom:8px;padding:8px;background:rgba(255,0,144,0.05);border:1px solid rgba(255,0,144,0.2);border-radius:4px">
        <label style="color:#ff0090;margin-top:0;font-size:.58rem">Agent Personality</label>
        <select id="orc_agent_personality" style="width:100%;font-size:.62rem;padding:3px">
          <option value="stealthy">Stealthy</option>
          <option value="aggressive" selected>Aggressive</option>
          <option value="analytical">Professional</option>
        </select>
      </div>

      <label style="font-size:.6rem">Evaluation Depth</label>
      <select id="orc_depth" style="width:100%;font-size:.65rem;padding:4px">
        <option value="surface">Surface</option>
        <option value="deep" selected>Deep (Policy Audit)</option>
        <option value="adversarial">Adversarial (Mutation)</option>
      </select>

      <div class="bR" style="margin-top:15px">
        <button class="btn bP" id="orc_start_btn" onclick="orcStartCampaign()" style="flex:1">▶ START</button>
        <button class="btn bD" id="orc_stop_btn" onclick="orcStopCampaign()" style="display:none;flex:1">⏹ STOP</button>
      </div>
    </div>

    <div class="S" style="padding:12px;flex:1">
      <div class="ST" style="font-size:.65rem">Campaign Stats</div>
      <div class="progress-bar show" id="orc_progress_bar" style="height:6px;margin:10px 0">
        <div class="progress-fill" id="orc_progress_fill"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="dash-stat-card" style="padding:8px"><div class="dash-stat-num" id="orc_stat_total" style="font-size:.9rem">0/0</div><div class="dash-stat-label" style="font-size:.5rem">Strikes</div></div>
        <div class="dash-stat-card" style="padding:8px;border-color:#ff009040"><div class="dash-stat-num" id="orc_stat_breach" style="font-size:.9rem;color:#ff0090">0</div><div class="dash-stat-label" style="font-size:.5rem">Breaches</div></div>
      </div>
      
      <div class="S" style="margin-top:15px;background:rgba(255,0,144,0.03);border:1px dashed #ff009030;padding:8px">
        <div class="ST" style="color:#ff0090;font-size:.55rem;margin-bottom:5px">LATEST VERDICT</div>
        <div id="orc_verdict" style="font-size:.6rem;color:#e0eaff;min-height:40px;line-height:1.3">No violations.</div>
      </div>
    </div>
  </div>

  <!-- 2. MIDDLE PANEL: ATTACK FEED (Flexible) -->
  <div class="S" style="flex:1.5;display:flex;flex-direction:column;margin-bottom:0;padding:12px;min-width:0">
    <div class="ST" style="justify-content:space-between;margin-bottom:10px">
      <span style="font-size:.7rem">&#x26A1; AUTONOMOUS AUDIT FEED</span>
      <span id="orc_status_label" style="font-size:.55rem;color:#5a7a9a">IDLE</span>
    </div>
    <div id="orc_feed" style="flex:1;background:#020205;border:1px solid #0a2a3a;padding:12px;border-radius:4px;font-family:monospace;font-size:.68rem;color:#e0eaff;overflow-y:auto;line-height:1.4">
      <div style="color:#5a7a9a;text-align:center;margin-top:150px">Ready for security assessment.</div>
    </div>
  </div>

  <!-- 3. RIGHT PANEL: BRAIN HUD (Flexible) -->
  <div class="S" style="flex:1;display:flex;flex-direction:column;margin-bottom:0;border-color:rgba(0,240,255,0.3);padding:12px;background:rgba(0,240,255,0.01);min-width:0">
    <div class="ST" style="font-size:.65rem;color:#00f0ff;justify-content:space-between;margin-bottom:10px">
      <span>&#x1F9E0; BRAIN HUD</span>
      <button class="btn bS" style="font-size:.45rem;padding:1px 4px;border:none" onclick="document.getElementById('orc_raw_traffic').innerHTML=''">Clear</button>
    </div>
    <div id="orc_raw_traffic" style="flex:1;background:#010103;border:1px solid #0a2a3a;padding:10px;border-radius:4px;font-family:monospace;font-size:.58rem;color:#00ff90;overflow-y:auto;white-space:pre-wrap;scrollbar-width:thin">
      [SYSTEM] Awaiting activity...
    </div>
  </div>

</div>
